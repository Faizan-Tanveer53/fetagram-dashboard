version: "3.9"

services:
  fetagram-backend:
    build: ./backend
    container_name: fetagram-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./fetagram.db
      - JWT_SECRET_KEY=fetagram-enterprise-super-secret-jwt-key-2026
    volumes:
      - ./backend:/app

  fetagram-client-web:
    image: node:20-alpine
    container_name: fetagram-client-web
    working_dir: /app
    volumes:
      - ./client-web:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - fetagram-backend

  fetagram-admin-dashboard:
    image: node:20-alpine
    container_name: fetagram-admin-dashboard
    working_dir: /app
    volumes:
      - ./admin-dashboard:/app
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - fetagram-backend
