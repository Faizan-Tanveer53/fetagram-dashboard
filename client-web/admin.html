<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fetagram Admin Dashboard — Enterprise Governance & Telemetry</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='irisG' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='50%25' stop-color='%23ec4899'/%3E%3Cstop offset='100%25' stop-color='%23f43f5e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='%23090b12' stroke='url(%23irisG)' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='url(%23irisG)' stroke-width='3.5' stroke-dasharray='22 8'/%3E%3Ccircle cx='32' cy='32' r='9' fill='url(%23irisG)'/%3E%3Ccircle cx='42' cy='22' r='3.2' fill='%23ffffff'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-obsidian: #07090e;
      --bg-elevated: #0e111a;
      --bg-panel: #141824;
      --border-hairline: rgba(255, 255, 255, 0.06);
      --brand-gradient: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: var(--bg-obsidian);
      color: #f4f4f5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
    }
    .glass-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
    }
    .brand-btn {
      background: var(--brand-gradient);
      box-shadow: 0 4px 18px -2px rgba(236, 72, 153, 0.4);
    }
    .nav-active {
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.22), rgba(236, 72, 153, 0.10));
      border: 1px solid rgba(139, 92, 246, 0.38);
      color: #ffffff !important;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090a0f; }
    ::-webkit-scrollbar-thumb { background: #1e2436; border-radius: 3px; }
  </style>
</head>
<body>

  <!-- ADMIN AUTH GATE -->
  <div id="adminAuthOverlay" class="fixed inset-0 z-50 bg-[#090a0f] flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-md glass-card rounded-3xl p-8 shadow-2xl">
      <div class="flex items-center gap-3.5 mb-6">
        <div class="w-11 h-11 rounded-2xl brand-btn flex items-center justify-center font-black text-white text-lg">F</div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-tight">Fetagram Admin Dashboard</h1>
          <p class="text-xs text-slate-400">Isolated Governance & Moderation Console (Port 3001)</p>
        </div>
      </div>
      <div id="authErr" class="hidden mb-4 p-3 rounded-xl bg-rose-950/60 border border-rose-700/60 text-rose-200 text-xs"></div>
      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Admin Username or Email</label>
          <input id="adminIdentity" type="text" required placeholder="admin@fetagram.internal" class="w-full bg-[#090a0f] border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Master Password</label>
          <input id="adminPass" type="password" required placeholder="••••••••••••" class="w-full bg-[#090a0f] border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Backend API Gateway URL</label>
          <input id="adminApiUrlInput" type="text" placeholder="http://127.0.0.1:8000 or https://fetagram-platform.up.railway.app" class="w-full bg-[#090a0f] border border-white/10 rounded-xl px-3.5 py-2 text-xs text-slate-300 font-mono focus:outline-none focus:border-purple-500" />
        </div>
        <button type="submit" class="w-full brand-btn text-white font-semibold py-2.5 rounded-xl text-sm transition">Authenticate Admin Session</button>
      </form>
    </div>
  </div>

  <!-- LEFT SIDEBAR -->
  <aside class="w-[248px] shrink-0 bg-[#0c0e16] border-r border-white/10 flex flex-col justify-between p-4 select-none">
    <div>
      <div class="flex items-center gap-3 px-2 py-2.5 mb-5 border-b border-white/10">
        <div class="w-9 h-9 rounded-full brand-btn flex items-center justify-center font-black text-white text-base shadow-md">
          <svg width="20" height="20" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="24" stroke="#fff" stroke-width="4"/><circle cx="32" cy="32" r="14" stroke="#fff" stroke-width="3" stroke-dasharray="18 7"/><circle cx="32" cy="32" r="6" fill="#fff"/></svg>
        </div>
        <div>
          <div class="font-bold italic text-sm text-white tracking-tight">Fetagram Admin</div>
          <div class="text-[10px] text-emerald-400 font-mono flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> PORT 3001 • RBAC
          </div>
        </div>
      </div>

      <nav class="space-y-1">
        <button onclick="switchTab('overview')" id="tab-overview" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/5 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>Dashboard Overview</span>
        </button>
        <button onclick="switchTab('users')" id="tab-users" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/5 transition">
          <div class="flex items-center gap-3">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>User Management</span>
          </div>
          <span id="navBadgeUsers" class="text-[10px] font-mono bg-white/10 px-1.5 py-0.5 rounded text-slate-300">0</span>
        </button>
        <button onclick="switchTab('posts')" id="tab-posts" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/5 transition">
          <div class="flex items-center gap-3">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>Content Moderation</span>
          </div>
          <span id="navBadgePosts" class="text-[10px] font-mono bg-white/10 px-1.5 py-0.5 rounded text-slate-300">0</span>
        </button>
        <button onclick="switchTab('chats')" id="tab-chats" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/5 transition">
          <div class="flex items-center gap-3">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Live Chat Monitor</span>
          </div>
          <span id="navBadgeChats" class="text-[10px] font-mono bg-pink-500/20 text-pink-300 px-1.5 py-0.5 rounded">LIVE</span>
        </button>
        <button onclick="switchTab('reports')" id="tab-reports" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/5 transition">
          <div class="flex items-center gap-3">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span>Reports & Flags</span>
          </div>
          <span id="navBadgeReports" class="hidden text-[10px] font-bold bg-rose-600 text-white px-1.5 py-0.5 rounded-full">0</span>
        </button>
        <button onclick="switchTab('broadcast')" id="tab-broadcast" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/5 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <span>Broadcast & Alerts</span>
        </button>
        <button onclick="switchTab('logs')" id="tab-logs" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/5 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          <span>Settings / Audit Logs</span>
        </button>
      </nav>
    </div>

    <div class="pt-4 border-t border-white/10 space-y-2">
      <div class="flex items-center gap-2.5 px-2 py-1.5 rounded-xl bg-white/[0.03] border border-white/5">
        <div class="w-8 h-8 rounded-full brand-btn flex items-center justify-center text-xs font-bold text-white" id="adminAvatarChar">A</div>
        <div class="min-w-0 flex-1">
          <div id="adminUserLabel" class="text-xs font-bold text-white truncate">admin</div>
          <div id="adminRoleLabel" class="text-[10px] text-purple-400 font-mono">SUPER_ADMIN</div>
        </div>
      </div>
      <button onclick="adminLogout()" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl text-xs text-rose-400 hover:bg-rose-950/40 border border-rose-500/20 font-semibold transition">
        <span>Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- MAIN WORKSPACE -->
  <div class="flex-1 flex flex-col h-full overflow-hidden">
    <!-- Top Header Bar -->
    <header class="h-16 border-b border-white/10 px-8 flex items-center justify-between bg-[#0c0e16]/90 backdrop-blur shrink-0">
      <div class="flex items-center gap-4">
        <h2 id="headerTitle" class="text-lg font-bold text-white tracking-tight">Fetagram Admin Dashboard</h2>
        <span class="text-[11px] font-mono px-2.5 py-1 rounded-full bg-purple-500/10 border border-purple-500/30 text-purple-300">SQLite Live Engine</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="relative">
          <input id="globalAdminFilter" oninput="renderCurrentTab()" type="text" placeholder="Filter users, posts, or audit logs..." class="w-64 bg-[#090a0f] border border-white/10 rounded-xl pl-3.5 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-purple-500" />
        </div>
        <button onclick="refreshAllData()" class="px-3.5 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-semibold text-slate-200 transition flex items-center gap-1.5">
          <span>Refresh Telemetry</span>
        </button>
      </div>
    </header>

    <!-- Main Scrollable Content -->
    <main id="adminBody" class="flex-1 overflow-y-auto p-8 space-y-6"></main>
  </div>

  <!-- Toast Notification -->
  <div id="adminToast" class="fixed bottom-5 right-5 z-50 hidden px-4 py-2.5 rounded-xl glass-card border border-purple-500/40 text-xs font-medium text-white shadow-2xl"></div>

  <script src="/env-config.js" onerror="void(0)"></script>
  <script>
    const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const defaultApi = isLocalHost ? 'http://127.0.0.1:8000' : 'https://fetagram.up.railway.app';
    let storedApi = localStorage.getItem('fetagram_admin_api_url') || '';
    if (!isLocalHost && storedApi.includes('127.0.0.1')) storedApi = '';
    let API_BASE = (window.FETAGRAM_API_URL || storedApi || defaultApi).replace(/\/+$/, '');
    const apiUrlInp = document.getElementById('adminApiUrlInput');
    if (apiUrlInp) apiUrlInp.value = API_BASE;
    let adminToken = localStorage.getItem('fetagram_admin_jwt') || '';
    let adminUser = null;
    let activeTab = 'overview';

    let state = {
      stats: {
        total_users: 0, active_users: 0, banned_users: 0, verified_users: 0,
        total_posts: 0, total_comments: 0, total_likes: 0, total_stories: 0,
        total_reels: 0, total_messages: 0, pending_reports: 0, resolved_reports: 0
      },
      users: [],
      posts: [],
      reports: [],
      logs: []
    };

    function normalizeMediaUrl(url) {
      if (!url) return '';
      const raw = String(url).trim();
      if (raw.startsWith('data:') || raw.startsWith('blob:')) return raw;
      if (raw.startsWith('http://localhost:8000')) return raw.replace('http://localhost:8000', API_BASE);
      if (raw.startsWith('http://127.0.0.1:8000')) return raw.replace('http://127.0.0.1:8000', API_BASE);
      if (raw.startsWith('http://') || raw.startsWith('https://')) return raw;
      if (raw.startsWith('/uploads/')) return `${API_BASE}${raw}`;
      if (raw.startsWith('uploads/')) return `${API_BASE}/${raw}`;
      return `${API_BASE}/uploads/${raw.replace(/^\/+/, '')}`;
    }

    function showToast(msg) {
      const el = document.getElementById('adminToast');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3200);
    }

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (adminToken) headers['Authorization'] = `Bearer ${adminToken}`;
      if (!(options.body instanceof FormData) && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }
      const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
      return data;
    }

    async function bootAdmin() {
      if (!adminToken) {
        document.getElementById('adminAuthOverlay').classList.remove('hidden');
        return;
      }
      try {
        const me = await api('/api/auth/me');
        if (me.role !== 'ADMIN' && me.role !== 'SUPER_ADMIN') {
          throw new Error('Administrative privilege required');
        }
        adminUser = me;
        document.getElementById('adminUserLabel').textContent = me.username;
        document.getElementById('adminRoleLabel').textContent = me.role;
        document.getElementById('adminAvatarChar').textContent = (me.username || 'A')[0].toUpperCase();
        document.getElementById('adminAuthOverlay').classList.add('hidden');
        await refreshAllData();
      } catch (err) {
        adminToken = '';
        localStorage.removeItem('fetagram_admin_jwt');
        document.getElementById('adminAuthOverlay').classList.remove('hidden');
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const errEl = document.getElementById('authErr');
      errEl.classList.add('hidden');
      try {
        const customApi = (document.getElementById('adminApiUrlInput')?.value || '').trim().replace(/\/+$/, '');
        if (customApi) {
          API_BASE = customApi;
          localStorage.setItem('fetagram_admin_api_url', customApi);
        }
        const username = document.getElementById('adminIdentity').value.trim();
        const password = document.getElementById('adminPass').value;
        const data = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });
        if (data.user.role !== 'ADMIN' && data.user.role !== 'SUPER_ADMIN') {
          throw new Error('Access denied: Account does not hold ADMIN or SUPER_ADMIN role.');
        }
        adminToken = data.access_token;
        localStorage.setItem('fetagram_admin_jwt', adminToken);
        await bootAdmin();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    }

    function adminLogout() {
      adminToken = '';
      localStorage.removeItem('fetagram_admin_jwt');
      location.reload();
    }

    async function refreshAllData() {
      try {
        const [stats, users, posts, reports, logs, chatConvs] = await Promise.all([
          api('/api/admin/stats'),
          api('/api/admin/users'),
          api('/api/admin/posts'),
          api('/api/admin/reports'),
          api('/api/admin/audit-logs'),
          api('/api/admin/chats/conversations').catch(() => [])
        ]);
        state = {
          ...state,
          stats,
          users,
          posts,
          reports,
          logs,
          chatConversations: chatConvs || []
        };
        document.getElementById('navBadgeUsers').textContent = stats.total_users;
        document.getElementById('navBadgePosts').textContent = stats.total_posts;
        const chatBadge = document.getElementById('navBadgeChats');
        if (chatBadge) chatBadge.textContent = (chatConvs || []).length;
        const repBadge = document.getElementById('navBadgeReports');
        if (stats.pending_reports > 0) {
          repBadge.textContent = stats.pending_reports;
          repBadge.classList.remove('hidden');
        } else {
          repBadge.classList.add('hidden');
        }
        if (state.selectedChatThreadId) {
          state.chatMessages = await api(`/api/admin/chats/${state.selectedChatThreadId}/messages`).catch(() => []);
        } else if ((chatConvs || []).length > 0) {
          state.selectedChatThreadId = chatConvs[0].id;
          state.chatMessages = await api(`/api/admin/chats/${chatConvs[0].id}/messages`).catch(() => []);
        }
        renderCurrentTab();
      } catch (err) {
        showToast(err.message);
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      ['overview', 'users', 'posts', 'chats', 'reports', 'broadcast', 'logs'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (btn) btn.classList.toggle('nav-active', t === tab);
      });
      renderCurrentTab();
    }

    async function selectAdminChatThread(threadId) {
      state.selectedChatThreadId = threadId;
      state.chatMessages = await api(`/api/admin/chats/${threadId}/messages`).catch(() => []);
      renderCurrentTab();
    }

    async function adminEditChatMessage(msgId, currentText) {
      const nextText = prompt('Edit message content (Admin Moderation):', currentText || '');
      if (nextText === null || nextText.trim() === '') return;
      await api(`/api/admin/chats/messages/${msgId}`, {
        method: 'PUT',
        body: JSON.stringify({ content: nextText.trim() })
      });
      showToast(`Message #${msgId} updated by moderator`);
      await refreshAllData();
    }

    async function adminDeleteChatMessage(msgId) {
      await api(`/api/admin/chats/messages/${msgId}`, {
        method: 'DELETE'
      });
      showToast(`Message #${msgId} removed from conversation`);
      await refreshAllData();
    }

    function renderCurrentTab() {
      const container = document.getElementById('adminBody');
      const filter = (document.getElementById('globalAdminFilter')?.value || '').toLowerCase().trim();
      const s = state.stats;

      const kpiHeaderHtml = `
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">
          <!-- KPI 1: Total Users -->
          <div class="glass-card rounded-2xl p-5 flex items-center justify-between">
            <div>
              <div class="text-xs text-slate-400 font-medium">Total Users</div>
              <div class="text-3xl font-extrabold text-white mt-1 font-mono">${s.total_users}</div>
              <div class="text-[11px] text-emerald-400 mt-1.5 font-medium">${s.active_users} active • ${s.verified_users} verified</div>
            </div>
            <svg class="w-24 h-12" viewBox="0 0 100 45">
              <defs>
                <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
                  <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
                </linearGradient>
              </defs>
              <path d="M0 38 Q 25 30, 50 22 T 100 8 L 100 45 L 0 45 Z" fill="url(#g1)"/>
              <path d="M0 38 Q 25 30, 50 22 T 100 8" fill="none" stroke="#a855f7" stroke-width="2.5"/>
            </svg>
          </div>

          <!-- KPI 2: Published Media Posts -->
          <div class="glass-card rounded-2xl p-5 flex items-center justify-between">
            <div>
              <div class="text-xs text-slate-400 font-medium">Published Posts</div>
              <div class="text-3xl font-extrabold text-white mt-1 font-mono">${s.total_posts}</div>
              <div class="text-[11px] text-purple-300 mt-1.5 font-medium">${s.total_likes} likes • ${s.total_comments} comments</div>
            </div>
            <svg class="w-24 h-12" viewBox="0 0 100 45">
              <defs>
                <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5"/>
                  <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
                </linearGradient>
              </defs>
              <path d="M0 35 Q 30 18, 60 24 T 100 6 L 100 45 L 0 45 Z" fill="url(#g2)"/>
              <path d="M0 35 Q 30 18, 60 24 T 100 6" fill="none" stroke="#ec4899" stroke-width="2.5"/>
            </svg>
          </div>

          <!-- KPI 3: Pending Reports -->
          <div class="glass-card rounded-2xl p-5 flex items-center justify-between">
            <div>
              <div class="text-xs text-slate-400 font-medium">Pending Reports</div>
              <div class="text-3xl font-extrabold ${s.pending_reports > 0 ? 'text-amber-400' : 'text-white'} mt-1 font-mono">${s.pending_reports}</div>
              <div class="text-[11px] text-slate-400 mt-1.5 font-medium">${s.resolved_reports} resolved flags</div>
            </div>
            <svg class="w-20 h-12" viewBox="0 0 80 45">
              <rect x="8" y="22" width="10" height="20" rx="2" fill="#6366f1"/>
              <rect x="24" y="14" width="10" height="28" rx="2" fill="#8b5cf6"/>
              <rect x="40" y="18" width="10" height="24" rx="2" fill="#d946ef"/>
              <rect x="56" y="8" width="10" height="34" rx="2" fill="#f43f5e"/>
            </svg>
          </div>

          <!-- KPI 4: Banned / Suspended Accounts -->
          <div class="glass-card rounded-2xl p-5 flex items-center justify-between">
            <div>
              <div class="text-xs text-slate-400 font-medium">Suspended Accounts</div>
              <div class="text-3xl font-extrabold ${s.banned_users > 0 ? 'text-rose-400' : 'text-white'} mt-1 font-mono">${s.banned_users}</div>
              <div class="text-[11px] text-slate-400 mt-1.5 font-medium">${s.total_messages} direct messages</div>
            </div>
            <svg class="w-20 h-12" viewBox="0 0 80 45">
              <rect x="8" y="25" width="10" height="17" rx="2" fill="#334155"/>
              <rect x="24" y="19" width="10" height="23" rx="2" fill="#475569"/>
              <rect x="40" y="12" width="10" height="30" rx="2" fill="#f43f5e"/>
              <rect x="56" y="16" width="10" height="26" rx="2" fill="#fb7185"/>
            </svg>
          </div>
        </div>
      `;

      if (activeTab === 'chats') {
        const convs = state.chatConversations || [];
        const activeThread = convs.find(c => Number(c.id) === Number(state.selectedChatThreadId)) || convs[0];
        const msgs = state.chatMessages || [];
        container.innerHTML = `
          ${kpiHeaderHtml}
          <div class="glass-card rounded-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-12 min-h-[540px]">
            <!-- Left 4 Cols: All Active User Conversation Threads -->
            <div class="lg:col-span-4 border-r border-white/10 p-4 flex flex-col bg-[#0b0d15]">
              <div class="flex items-center justify-between mb-3 pb-2 border-b border-white/10">
                <div>
                  <h3 class="text-sm font-bold text-white">Live Chat Monitor &amp; Moderation</h3>
                  <p class="text-[11px] text-slate-400">${convs.length} active user conversation threads</p>
                </div>
                <button onclick="refreshAllData()" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 text-[11px] text-purple-300 font-semibold">Sync</button>
              </div>
              <div class="space-y-2 overflow-y-auto flex-1">
                ${convs.length === 0 ? `
                  <div class="p-6 text-center text-xs text-slate-400">No direct message threads in database yet.</div>
                ` : convs.map(c => {
                  const isSel = activeThread && Number(activeThread.id) === Number(c.id);
                  return `
                    <div onclick="selectAdminChatThread(${c.id})" class="p-3 rounded-xl cursor-pointer transition border ${isSel ? 'bg-purple-500/15 border-purple-500/40' : 'bg-[#090a0f] border-white/5 hover:border-white/15'}">
                      <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-white">@${c.user_a?.username || 'user1'} ↔ @${c.user_b?.username || 'user2'}</span>
                        <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-white/10 text-slate-300">${c.message_count || 0} msgs</span>
                      </div>
                      <div class="text-[11px] text-slate-400 truncate mt-1">${c.last_message ? c.last_message.content : 'No messages'}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Right 8 Cols: Full Chat Transcript with Edit / Delete Controls -->
            <div class="lg:col-span-8 p-5 flex flex-col justify-between bg-[#080a10]">
              ${!activeThread ? `
                <div class="flex-1 flex items-center justify-center text-slate-400 text-xs">Select a conversation thread on the left to inspect and moderate messages.</div>
              ` : `
                <div class="pb-3 mb-3 border-b border-white/10 flex items-center justify-between">
                  <div>
                    <div class="text-sm font-bold text-white">Thread #${activeThread.id}: @${activeThread.user_a?.username} &amp; @${activeThread.user_b?.username}</div>
                    <div class="text-[11px] text-slate-400">Super-Admin Live Transcript Inspection • Edit or Purge abusive messages</div>
                  </div>
                  <span class="text-[11px] font-mono text-emerald-400">● Audit Logging Active</span>
                </div>

                <div class="flex-1 overflow-y-auto space-y-2.5 max-h-[410px] pr-1">
                  ${msgs.length === 0 ? `
                    <div class="p-8 text-center text-xs text-slate-400">This thread has no messages.</div>
                  ` : msgs.map(m => {
                    const safeContent = (m.content || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    return `
                      <div class="p-3.5 rounded-xl bg-[#0e111a] border border-white/10 flex items-start justify-between gap-4">
                        <div class="min-w-0 flex-1">
                          <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-purple-300">@${m.sender_username || 'user'}</span>
                            <span class="text-[10px] font-mono text-slate-500">Msg #${m.id} • ${m.created_at || ''}</span>
                          </div>
                          <div class="text-xs text-white mt-1 break-words">${m.content || ''}</div>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                          <button onclick="adminEditChatMessage(${m.id}, '${safeContent}')" class="px-2.5 py-1 rounded-lg bg-sky-500/15 hover:bg-sky-500/25 text-sky-300 border border-sky-500/30 text-[11px] font-semibold">Edit</button>
                          <button onclick="adminDeleteChatMessage(${m.id})" class="px-2.5 py-1 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-semibold">Delete</button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          </div>
        `;
        return;
      }

      if (activeTab === 'overview') {
        const filteredUsers = state.users.filter(u => !filter || u.username.toLowerCase().includes(filter) || (u.email || '').toLowerCase().includes(filter));
        const pendingReports = state.reports;
        container.innerHTML = `
          ${kpiHeaderHtml}

          <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">
            <!-- Left 7 Cols: User Management Governance Table -->
            <div class="xl:col-span-7 glass-card rounded-2xl p-6">
              <div class="flex items-center justify-between mb-4">
                <div>
                  <h3 class="text-sm font-bold text-white">User Management & Role Governance</h3>
                  <p class="text-xs text-slate-400">Real-time SQLite user directory with instant session revocation</p>
                </div>
                <button onclick="switchTab('users')" class="text-xs text-purple-400 hover:text-purple-300 font-semibold">Expand Full Directory →</button>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b border-white/10 text-[11px] uppercase tracking-wider text-slate-400">
                      <th class="py-2.5 px-2">User</th>
                      <th class="py-2.5 px-2">Role</th>
                      <th class="py-2.5 px-2">Status</th>
                      <th class="py-2.5 px-2">Posts</th>
                      <th class="py-2.5 px-2 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-white/5 text-xs">
                    ${filteredUsers.map(u => `
                      <tr class="hover:bg-white/[0.02]">
                        <td class="py-3 px-2">
                          <div class="font-semibold text-white flex items-center gap-1">
                            <span>@${u.username}</span>
                            ${u.is_verified ? '<span class="text-sky-400">✓</span>' : ''}
                          </div>
                          <div class="text-[11px] text-slate-400">${u.email}</div>
                        </td>
                        <td class="py-3 px-2 font-mono text-[11px] text-purple-300">${u.role}</td>
                        <td class="py-3 px-2">
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${u.is_banned ? 'bg-rose-950 text-rose-300 border border-rose-700' : 'bg-emerald-950 text-emerald-300 border border-emerald-700'}">
                            ${u.is_banned ? 'SUSPENDED' : 'ACTIVE'}
                          </span>
                        </td>
                        <td class="py-3 px-2 font-mono">${u.posts_count || 0}</td>
                        <td class="py-3 px-2 text-right space-x-1">
                          <button onclick="toggleVerify(${u.id})" class="px-2 py-1 rounded-lg bg-sky-500/10 hover:bg-sky-500/20 text-sky-300 border border-sky-500/30 text-[11px]">${u.is_verified ? 'Unverify' : 'Verify'}</button>
                          ${u.role !== 'SUPER_ADMIN' ? `
                            <button onclick="toggleBan(${u.id})" class="px-2 py-1 rounded-lg ${u.is_banned ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30' : 'bg-amber-500/10 text-amber-300 border-amber-500/30'} border text-[11px]">${u.is_banned ? 'Restore' : 'Suspend'}</button>
                            <button onclick="deleteUser(${u.id})" class="px-2 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 text-[11px]">Delete</button>
                          ` : ''}
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Right 5 Cols: Content Moderation & Pending Reports Queue -->
            <div class="xl:col-span-5 space-y-6">
              <div class="glass-card rounded-2xl p-6">
                <div class="flex items-center justify-between mb-4">
                  <div>
                    <h3 class="text-sm font-bold text-white">Content Moderation & Reports Queue</h3>
                    <p class="text-xs text-slate-400">${pendingReports.length} total submitted reports</p>
                  </div>
                  <button onclick="switchTab('reports')" class="text-xs text-pink-400 hover:text-pink-300 font-semibold">All Flags →</button>
                </div>
                <div class="space-y-3 max-h-[240px] overflow-y-auto pr-1">
                  ${pendingReports.length === 0 ? `
                    <div class="p-6 text-center rounded-xl bg-white/[0.02] border border-white/5 text-xs text-slate-400">
                      Zero pending moderation reports in the queue.
                    </div>
                  ` : pendingReports.slice(0, 5).map(r => `
                    <div class="p-3.5 rounded-xl bg-[#090a0f] border border-white/10 flex items-center justify-between gap-3">
                      <div class="min-w-0">
                        <div class="flex items-center gap-2">
                          <span class="px-2 py-0.5 rounded text-[10px] font-bold ${r.status === 'PENDING' ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'}">${r.status}</span>
                          <span class="text-xs font-semibold text-white truncate">Reason: ${r.reason}</span>
                        </div>
                        <div class="text-[11px] text-slate-400 mt-1">Reporter @${r.reporter_username} • Post #${r.target_post_id || 'N/A'}</div>
                      </div>
                      ${r.status === 'PENDING' ? `
                        <div class="flex items-center gap-1.5 shrink-0">
                          <button onclick="resolveReport(${r.id}, 'DISMISSED')" class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/15 text-xs text-slate-200">Dismiss</button>
                          <button onclick="resolveReport(${r.id}, 'RESOLVED', true)" class="px-2.5 py-1 rounded-lg bg-rose-600 hover:bg-rose-500 text-xs text-white font-semibold">Purge Post</button>
                        </div>
                      ` : ''}
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Live Media Inspection Strip -->
              <div class="glass-card rounded-2xl p-6">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-sm font-bold text-white">Recent Media Stream Inspection</h3>
                  <button onclick="switchTab('posts')" class="text-xs text-purple-400 hover:text-purple-300 font-semibold">Inspect All (${state.posts.length}) →</button>
                </div>
                <div class="grid grid-cols-3 gap-3">
                  ${state.posts.slice(0, 3).map(p => `
                    <div class="rounded-xl overflow-hidden border border-white/10 bg-[#08090d] group relative">
                      ${(p.media_type === 'VIDEO' || String(p.media_url).endsWith('.mp4'))
                        ? `<video src="${normalizeMediaUrl(p.media_url)}" preload="metadata" muted playsinline class="w-full h-24 object-cover"></video>`
                        : `<img src="${normalizeMediaUrl(p.media_url)}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'flex flex-col items-center justify-center p-4 bg-zinc-900/60 text-zinc-500 h-24\\'><span class=\\'text-[10px]\\'>Media unavailable</span></div>';" class="w-full h-24 object-cover" alt="Post #${p.id}" />`
                      }
                      <div class="p-2 flex items-center justify-between text-[11px]">
                        <span class="truncate text-slate-300">@${p.username || p.author_username}</span>
                        <button onclick="deletePost(${p.id})" class="text-rose-400 hover:text-rose-300 font-semibold">Purge</button>
                      </div>
                    </div>
                  `).join('') || '<div class="col-span-3 text-xs text-slate-400 py-4 text-center">No media posts stored.</div>'}
                </div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (activeTab === 'users') {
        const list = state.users.filter(u => !filter || u.username.toLowerCase().includes(filter) || (u.email || '').toLowerCase().includes(filter));
        container.innerHTML = `
          ${kpiHeaderHtml}
          <div class="glass-card rounded-2xl p-6">
            <h3 class="text-base font-bold text-white mb-4">Complete User Directory (${list.length})</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-white/10 text-xs text-slate-400">
                    <th class="py-3 px-3">ID</th>
                    <th class="py-3 px-3">Identity</th>
                    <th class="py-3 px-3">Role</th>
                    <th class="py-3 px-3">State</th>
                    <th class="py-3 px-3">Posts</th>
                    <th class="py-3 px-3 text-right">Governance Controls</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-white/5 text-xs">
                  ${list.map(u => `
                    <tr>
                      <td class="py-3 px-3 font-mono text-slate-400">#${u.id}</td>
                      <td class="py-3 px-3">
                        <div class="font-bold text-white">@${u.username} ${u.is_verified ? '✓' : ''}</div>
                        <div class="text-slate-400">${u.email}</div>
                      </td>
                      <td class="py-3 px-3 font-mono text-purple-300">${u.role}</td>
                      <td class="py-3 px-3">${u.is_banned ? '<span class="text-rose-400 font-bold">SUSPENDED</span>' : '<span class="text-emerald-400 font-bold">ACTIVE</span>'}</td>
                      <td class="py-3 px-3 font-mono">${u.posts_count || 0}</td>
                      <td class="py-3 px-3 text-right space-x-2">
                        <button onclick="toggleVerify(${u.id})" class="px-3 py-1 rounded-lg bg-sky-500/15 text-sky-300 border border-sky-500/30">${u.is_verified ? 'Revoke Badge' : 'Grant Verified'}</button>
                        ${u.role !== 'SUPER_ADMIN' ? `
                          <button onclick="toggleBan(${u.id})" class="px-3 py-1 rounded-lg bg-amber-500/15 text-amber-300 border border-amber-500/30">${u.is_banned ? 'Unban User' : 'Ban User'}</button>
                          <button onclick="deleteUser(${u.id})" class="px-3 py-1 rounded-lg bg-rose-600 text-white">Delete Account</button>
                        ` : ''}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
        return;
      }

      if (activeTab === 'posts') {
        const list = state.posts.filter(p => !filter || (p.caption || '').toLowerCase().includes(filter) || (p.author_username || '').toLowerCase().includes(filter));
        container.innerHTML = `
          ${kpiHeaderHtml}
          <div class="glass-card rounded-2xl p-6">
            <h3 class="text-base font-bold text-white mb-4">Content Moderation Grid (${list.length} Posts)</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-5">
              ${list.map(p => `
                <div class="rounded-2xl overflow-hidden border border-white/10 bg-[#090a0f] flex flex-col justify-between">
                  <div>
                    <img src="${normalizeMediaUrl(p.media_url)}" class="w-full h-44 object-cover bg-black" alt="Post #${p.id}" />
                    <div class="p-4">
                      <div class="flex items-center justify-between text-xs font-bold text-white">
                        <span>@${p.author_username}</span>
                        <span class="font-mono text-slate-400">#${p.id}</span>
                      </div>
                      <p class="text-xs text-slate-300 mt-1.5 line-clamp-2">${p.caption || 'No caption'}</p>
                    </div>
                  </div>
                  <div class="p-3 border-t border-white/10 flex items-center justify-between text-xs">
                    <span class="text-slate-400">${p.likes_count || 0}♥ • ${p.comments_count || 0}💬</span>
                    <button onclick="deletePost(${p.id})" class="px-3 py-1 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-semibold">Purge Media</button>
                  </div>
                </div>
              `).join('') || '<div class="col-span-4 text-center py-12 text-slate-400 text-sm">No published posts match filter.</div>'}
            </div>
          </div>
        `;
        return;
      }

      if (activeTab === 'reports') {
        container.innerHTML = `
          ${kpiHeaderHtml}
          <div class="glass-card rounded-2xl p-6">
            <h3 class="text-base font-bold text-white mb-4">Trust & Safety Incident Reports (${state.reports.length})</h3>
            <div class="space-y-3">
              ${state.reports.map(r => `
                <div class="p-4 rounded-xl bg-[#090a0f] border border-white/10 flex items-center justify-between">
                  <div>
                    <div class="flex items-center gap-2.5">
                      <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${r.status === 'PENDING' ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'}">${r.status}</span>
                      <span class="text-sm font-bold text-white">Incident #${r.id} — ${r.reason}</span>
                    </div>
                    <div class="text-xs text-slate-400 mt-1">Submitted by @${r.reporter_username} • Target Post ID: ${r.target_post_id || 'N/A'} • Target User ID: ${r.target_user_id || 'N/A'}</div>
                  </div>
                  ${r.status === 'PENDING' ? `
                    <div class="flex items-center gap-2">
                      <button onclick="resolveReport(${r.id}, 'DISMISSED', false)" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/15 text-xs text-white">Dismiss Report</button>
                      <button onclick="resolveReport(${r.id}, 'RESOLVED', true)" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-xs text-white font-semibold">Remove Post & Resolve</button>
                    </div>
                  ` : `<span class="text-xs text-slate-500 font-mono">Reviewed</span>`}
                </div>
              `).join('') || '<div class="text-center py-12 text-slate-400 text-sm">Zero moderation reports filed.</div>'}
            </div>
          </div>
        `;
        return;
      }

      if (activeTab === 'broadcast') {
        container.innerHTML = `
          ${kpiHeaderHtml}
          <div class="max-w-2xl glass-card rounded-2xl p-6">
            <h3 class="text-base font-bold text-white mb-1">Global System Announcement Broadcast</h3>
            <p class="text-xs text-slate-400 mb-4">Dispatches a real-time system notification to every non-banned user and writes an immutable entry to the Admin Audit Trail.</p>
            <form onsubmit="sendBroadcast(event)" class="space-y-4">
              <textarea id="broadcastText" rows="4" required placeholder="Enter official platform announcement..." class="w-full bg-[#090a0f] border border-white/10 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-purple-500"></textarea>
              <button type="submit" class="brand-btn px-6 py-2.5 rounded-xl text-xs font-bold text-white">Dispatch Global Broadcast</button>
            </form>
          </div>
        `;
        return;
      }

      if (activeTab === 'logs') {
        container.innerHTML = `
          ${kpiHeaderHtml}
          <div class="glass-card rounded-2xl p-6">
            <h3 class="text-base font-bold text-white mb-4">Immutable Admin Audit Trail (${state.logs.length} Events)</h3>
            <div class="space-y-2 font-mono text-xs">
              ${state.logs.map(l => `
                <div class="p-3 rounded-xl bg-[#090a0f] border border-white/10 flex items-center justify-between">
                  <div>
                    <span class="text-purple-400 font-bold">[${l.action}]</span>
                    <span class="text-white ml-2">${l.details || ''}</span>
                  </div>
                  <div class="text-slate-400">by @${l.admin_username} • ${new Date(l.created_at).toLocaleString()}</div>
                </div>
              `).join('') || '<div class="text-slate-400 py-8 text-center">No audit events recorded yet.</div>'}
            </div>
          </div>
        `;
      }
    }

    async function toggleVerify(userId) {
      await api(`/api/admin/users/${userId}/verify`, { method: 'POST' });
      showToast(`Updated verification badge for User #${userId}`);
      await refreshAllData();
    }

    async function toggleBan(userId) {
      await api(`/api/admin/users/${userId}/ban`, { method: 'POST' });
      showToast(`Toggled account suspension for User #${userId}`);
      await refreshAllData();
    }

    async function deleteUser(userId) {
      await api(`/api/admin/users/${userId}`, { method: 'DELETE' });
      showToast(`Permanently deleted User #${userId}`);
      await refreshAllData();
    }

    async function deletePost(postId) {
      await api(`/api/admin/posts/${postId}`, { method: 'DELETE' });
      showToast(`Purged Post #${postId} and physical media file`);
      await refreshAllData();
    }

    async function resolveReport(reportId, status, deletePostFlag = false) {
      await api(`/api/admin/reports/${reportId}/resolve`, {
        method: 'POST',
        body: JSON.stringify({ status, delete_post: deletePostFlag, moderation_notes: `Reviewed by ${adminUser?.username || 'admin'}` })
      });
      showToast(`Report #${reportId} marked ${status}`);
      await refreshAllData();
    }

    async function sendBroadcast(e) {
      e.preventDefault();
      const message = document.getElementById('broadcastText').value.trim();
      if (!message) return;
      const res = await api('/api/admin/broadcast', {
        method: 'POST',
        body: JSON.stringify({ message })
      });
      document.getElementById('broadcastText').value = '';
      showToast(`Broadcast delivered to ${res.recipients} active accounts`);
      await refreshAllData();
    }

    bootAdmin();
  </script>
</body>
</html>
